# Loading minimal mistakes theme
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"

# Global configuration
title: "jPipe"
subtitle: "Justification made easier!"
title_separator: "::"

name: "Sébastien Mosser"
email: "contact@jpipe.org"

description: >- 
  jPipe is a tool designed by McSCert to support developers when writing justifications.

#baseurl: "/jpipe" 
#url: "http://ace-design.github.io" 

baseurl: "" 
url: "https://www.jpipe.org" 

locale: "en"
repository: "jpipe-mcscert"

logo: "/assets/images/logo.png"

twitter:
  username: petitroll

github_username:  mosser

# Build settings
markdown: kramdown

kramdown:
  toc_levels: 1..1
  # Rouge tokenization disabled: highlight.js is the sole highlighter (see head/custom.html).
  # This makes every fenced block emit a bare <pre><code class="language-x">, matching jpipe.
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from
  
include: 
  - _pages
  - _docs
  - _tutorials

exclude:
  - README

date_format: "%Y-%m-%d"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      classes: wide 
      layout: single
      show_date: true
      read_time: true
      sidebar: 
        nav: news
  # _tutorials
  - scope:
      path: ""
      type: tutorials
    values:
      layout: single
      author_profile: false
      sidebar: 
        nav: tutorials

lunr:
  search_within_pages: true


collections:
  tutorials:
    output: true
    permalink: /:collection/:path/
  docs:
    output: true
    permalink: /:collection/:path/
